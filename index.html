<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Calculate the radial distance to points on a circle involute."
    />
    <title>Involute calculator</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c2621;
        --muted: #59655d;
        --paper: #f6f3eb;
        --panel: #fffdf8;
        --accent: #096b50;
        --accent-dark: #064c3a;
        --line: #d8d7cb;
        --curve: #0b7bd6;
        --circle: #e07b39;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 85% 8%, #d4eadc 0, transparent 24rem),
          var(--paper);
        font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        width: min(100% - 2rem, 1200px);
        margin: 0 auto;
        padding: 1.1rem 0;
        gap: .9rem;
      }

      header { flex: 0 0 auto; display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }

      h1 {
        margin: 0;
        font-family: Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif;
        font-size: clamp(1.5rem, 3.4vw, 2.2rem);
        font-weight: 600;
        letter-spacing: -.03em;
      }

      .tagline { margin: 0; color: var(--muted); }

      .layout {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr) 240px;
        gap: .9rem;
      }

      .panel {
        min-height: 0;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        box-shadow: 0 8px 22px rgb(26 42 32 / 7%);
      }

      .panel h2 {
        flex: 0 0 auto;
        margin: 0;
        padding: .9rem 1.1rem .5rem;
        font-size: .8rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .controls { padding: 0 1.1rem 1rem; overflow-y: auto; }

      .field { margin-bottom: 1rem; }
      .field label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: .35rem;
        font-weight: 700;
      }
      .field output { color: var(--accent); font-variant-numeric: tabular-nums; }

      input[type="range"] { width: 100%; accent-color: var(--accent); }
      input[type="number"] {
        width: 100%;
        margin-top: .3rem;
        padding: .45rem .6rem;
        border: 1px solid #b8bcb5;
        border-radius: 8px;
        color: var(--ink);
        background: #fff;
        font: inherit;
      }
      input:focus { outline: 3px solid #9ed7c2; border-color: var(--accent); }
      .hint { margin: .3rem 0 0; color: var(--muted); font-size: .8rem; }

      .stats { margin-top: .4rem; border-top: 1px solid var(--line); padding-top: .8rem; }
      .stats dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: .3rem .6rem; }
      .stats dt { color: var(--muted); }
      .stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

      .graph-panel { padding: 0; }
      .graph-panel svg { flex: 1 1 auto; min-height: 0; width: 100%; height: 100%; }

      .axis { stroke: var(--line); stroke-width: 1; }
      .base-circle { fill: rgb(224 123 57 / 12%); stroke: var(--circle); stroke-width: 2; }
      .involute-path { fill: none; stroke: var(--curve); stroke-width: 2.5; stroke-linecap: round; }
      .string-line { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; }
      .radial-line { stroke: var(--ink); stroke-width: 1.3; }
      .marker-dot { fill: var(--curve); }
      .tangent-dot { fill: var(--circle); }
      .centre-dot { fill: var(--ink); }
      .svg-label { fill: var(--muted); font-size: 12px; }

      .table-wrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 1.1rem .6rem; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { padding: .4rem .25rem; text-align: right; border-bottom: 1px solid var(--line); }
      th {
        position: sticky; top: 0;
        background: var(--panel);
        color: var(--muted);
        font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
      }
      th:first-child, td:first-child { text-align: left; }
      tr.highlight td { background: #e7f3ec; font-weight: 700; }

      @media (max-width: 900px) {
        body { overflow: auto; }
        main { height: auto; }
        .layout { grid-template-columns: 1fr; }
        .graph-panel svg { min-height: 320px; }
        .table-wrap { max-height: 300px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Involute calculator</h1>
        <p class="tagline">Drag the sliders — everything updates live.</p>
      </header>

      <div class="layout">
        <section class="panel" aria-label="Inputs">
          <h2>Inputs</h2>
          <div class="controls">
            <div class="field">
              <label for="radius">Circle radius <output id="radius-value">45</output></label>
              <input id="radius" type="range" min="1" max="200" step="1" value="45" />
              <p class="hint">Use the same unit in which you want the distance reported.</p>
            </div>

            <div class="field">
              <label for="delta">Angle interval <output id="delta-value">15&deg;</output></label>
              <input id="delta" type="range" min="1" max="90" step="1" value="15" />
              <p class="hint">Table rows are sampled at this spacing.</p>
            </div>

            <div class="field">
              <label for="unwind">Unwound angle <output id="unwind-value">90&deg;</output></label>
              <input id="unwind" type="range" min="0" max="359" step="1" value="90" />
              <p class="hint">Moves the highlighted point along the curve.</p>
            </div>

            <div class="stats" aria-live="polite">
              <dl>
                <dt>Polar angle</dt><dd id="stat-polar">&ndash;</dd>
                <dt>Centre distance</dt><dd id="stat-distance">&ndash;</dd>
                <dt>Unwrapped length</dt><dd id="stat-arc">&ndash;</dd>
              </dl>
            </div>
          </div>
        </section>

        <section class="panel graph-panel" aria-label="Involute graph">
          <svg id="graph" viewBox="0 0 640 640" role="img" aria-label="A circle, its involute curve, the unwinding string, and the selected point.">
            <line class="axis" x1="0" y1="320" x2="640" y2="320"></line>
            <line class="axis" x1="320" y1="0" x2="320" y2="640"></line>
            <circle id="base-circle" class="base-circle" cx="320" cy="320"></circle>
            <path id="involute-path" class="involute-path"></path>
            <line id="string-line" class="string-line"></line>
            <line id="radial-line" class="radial-line"></line>
            <circle class="centre-dot" cx="320" cy="320" r="3.5"></circle>
            <circle id="tangent-dot" class="tangent-dot" r="4.5"></circle>
            <circle id="marker-dot" class="marker-dot" r="6"></circle>
            <text id="marker-label" class="svg-label"></text>
          </svg>
        </section>

        <section class="panel" aria-label="Results">
          <h2>Distances</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th scope="col">Angle</th><th scope="col">Distance</th></tr></thead>
              <tbody id="results"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const radiusRange = $('radius');
        const deltaRange = $('delta');
        const unwindRange = $('unwind');
        const radiusValue = $('radius-value');
        const deltaValue = $('delta-value');
        const unwindValue = $('unwind-value');
        const results = $('results');
        const statPolar = $('stat-polar');
        const statDistance = $('stat-distance');
        const statArc = $('stat-arc');
        const baseCircle = $('base-circle');
        const involutePath = $('involute-path');
        const stringLine = $('string-line');
        const radialLine = $('radial-line');
        const tangentDot = $('tangent-dot');
        const markerDot = $('marker-dot');
        const markerLabel = $('marker-label');

        const CX = 320, CY = 320;
        const dtr = (22 / 7) / 180;
        const rtd = 180 / (22 / 7);

        function calculateDistances(radius) {
          // A map keyed by the rounded angle deliberately matches main.py:
          // later samples replace earlier ones that round to the same angle.
          const samples = new Map();
          const totals = new Map();
          const counts = new Map();

          for (let t1 = 0; ; t1 += 0.01) {
            const side = radius * t1 * dtr;
            const t2 = Math.round((t1 - Math.atan(side / radius) * rtd) * 100) / 100;
            if (t2 >= 360) break;
            samples.set(t2, Math.hypot(radius, side));
          }

          for (const [angle, distance] of samples) {
            const degree = Math.ceil(angle);
            if (degree >= 360) break;
            totals.set(degree, (totals.get(degree) || 0) + distance);
            counts.set(degree, (counts.get(degree) || 0) + 1);
          }

          return [...totals].map(([degree, total]) => ({
            degree,
            distance: Math.round((total / counts.get(degree)) * 100) / 100,
          }));
        }

        function involutePoint(radius, t) {
          return {
            x: radius * (Math.cos(t) + t * Math.sin(t)),
            y: radius * (Math.sin(t) - t * Math.cos(t)),
          };
        }

        function renderGraph(radius, unwindDeg) {
          const t = unwindDeg * Math.PI / 180;
          const tMax = Math.max(t, Math.PI * 1.15);
          // Anchor the scale to the slider's maximum radius so changing the
          // radius visibly resizes the geometry (the involute is self-similar,
          // so a fit-to-view scale would make every radius look identical).
          const maxRadius = Number(radiusRange.max);
          let extent = maxRadius;
          for (let i = 0; i <= 240; i++) {
            const p = involutePoint(maxRadius, tMax * i / 240);
            extent = Math.max(extent, Math.abs(p.x), Math.abs(p.y));
          }
          const scale = 295 / extent;
          const sx = (v) => (CX + v * scale).toFixed(2);
          const sy = (v) => (CY - v * scale).toFixed(2);

          let d = '';
          for (let i = 0; i <= 240; i++) {
            const p = involutePoint(radius, tMax * i / 240);
            d += `${i === 0 ? 'M' : 'L'} ${sx(p.x)} ${sy(p.y)} `;
          }

          const selected = involutePoint(radius, t);
          const tangent = { x: radius * Math.cos(t), y: radius * Math.sin(t) };

          baseCircle.setAttribute('r', (radius * scale).toFixed(2));
          involutePath.setAttribute('d', d);
          stringLine.setAttribute('x1', sx(tangent.x));
          stringLine.setAttribute('y1', sy(tangent.y));
          stringLine.setAttribute('x2', sx(selected.x));
          stringLine.setAttribute('y2', sy(selected.y));
          radialLine.setAttribute('x1', CX);
          radialLine.setAttribute('y1', CY);
          radialLine.setAttribute('x2', sx(selected.x));
          radialLine.setAttribute('y2', sy(selected.y));
          tangentDot.setAttribute('cx', sx(tangent.x));
          tangentDot.setAttribute('cy', sy(tangent.y));
          markerDot.setAttribute('cx', sx(selected.x));
          markerDot.setAttribute('cy', sy(selected.y));
          markerLabel.setAttribute('x', Number(sx(selected.x)) + 10);
          markerLabel.setAttribute('y', Number(sy(selected.y)) - 10);
          markerLabel.textContent = `${unwindDeg}°`;

          const polar = (t - Math.atan(t)) * 180 / Math.PI;
          statPolar.textContent = `${polar.toFixed(2)}°`;
          statDistance.textContent = (radius * Math.hypot(1, t)).toFixed(2);
          statArc.textContent = (radius * t).toFixed(2);
          return polar;
        }

        function renderTable(radius, delta, polar) {
          const rows = calculateDistances(radius).filter(({ degree }) => degree % delta === 0);
          const highlightDegree = Math.ceil(polar);
          results.replaceChildren();
          let highlightRow = null;
          for (const { degree, distance } of rows) {
            const row = document.createElement('tr');
            const angle = document.createElement('td');
            const value = document.createElement('td');
            angle.textContent = `${degree}°`;
            value.textContent = distance.toFixed(2);
            row.append(angle, value);
            if (highlightRow === null && degree >= highlightDegree) {
              row.className = 'highlight';
              highlightRow = row;
            }
            results.append(row);
          }
          highlightRow?.scrollIntoView({ block: 'nearest' });
        }

        function render() {
          const radius = Number(radiusRange.value);
          const delta = Number(deltaRange.value);
          const unwind = Number(unwindRange.value);

          radiusValue.textContent = radius;
          deltaValue.textContent = `${delta}°`;
          unwindValue.textContent = `${unwind}°`;

          const polar = renderGraph(radius, unwind);
          renderTable(radius, delta, polar);
        }

        radiusRange.addEventListener('input', render);
        deltaRange.addEventListener('input', render);
        unwindRange.addEventListener('input', render);
        render();
      })();
    </script>
  </body>
</html>
