name: Validate and deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Check lint
        run: ./gradlew :composeApp:ktlintCheck --no-configuration-cache

      - name: Build Wasm distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-configuration-cache

      - name: Include doom (built by kunal26das/doom CI into doom-dist/)
        run: |
          if [ -d doom-dist ]; then
            cp -r doom-dist composeApp/build/dist/wasmJs/productionExecutable/doom
          fi

      - name: Include .well-known (skipped by resource copy)
        run: |
          cp -r composeApp/src/wasmJsMain/resources/.well-known composeApp/build/dist/wasmJs/productionExecutable/.well-known

      - name: Include publisher verification
        run: cp app-ads.txt composeApp/build/dist/wasmJs/productionExecutable/app-ads.txt

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v5
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable
          include-hidden-files: true

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
