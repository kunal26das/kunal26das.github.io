name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify geometry
        run: node --test tests/geometry.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p "$RUNNER_TEMP/involute-site"
          cp index.html explorer.html styles.css theme.js geometry.js explorer.js og-image.jpg robots.txt sitemap.xml "$RUNNER_TEMP/involute-site/"
          cp -R assets "$RUNNER_TEMP/involute-site/"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/involute-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
